[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceglass-verify"
version = "0.1.0"
description = "Independent offline verifier for the traceglass evidence format (tgcanon/1)"
readme = "README.md"
requires-python = ">=3.10"
# SPDX string, not a path: the repo LICENSE lives outside this directory and
# setuptools refuses to reach out of the package root.
license = "MIT"
dependencies = [
    # Ed25519 only. Everything else is the standard library.
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
traceglass-verify = "traceglass_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
